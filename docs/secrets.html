    .toggle input { width: 1.05rem; height: 1.05rem; }

    .callout { border-left: 4px solid #e0a800; background: #fff8e1; color: #5a4600; padding: .8rem 1rem; border-radius: 8px; margin: 1rem 0; font-size: .9rem; }
    .callout.danger { border-left-color: #d33; background: #fdecec; color: #7a1a1a; }

    .actions { display: flex; flex-wrap: wrap; gap: .7rem; margin: 1.2rem 0; }
    .btn { padding: .6rem 1.1rem; border-radius: 8px; border: 1px solid transparent; font: inherit; font-weight: 600; cursor: pointer; }
    .btn.primary { background: #2f6fd0; color: #fff; }
    .btn.primary:hover { background: #245bb0; }
    .btn.secondary { background: #eef3fa; color: #1f3552; border-color: #c6d2e1; }
    .btn.secondary:hover { background: #e2ebf7; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .repolist { border: 1px solid #d5deea; border-radius: 10px; max-height: 320px; overflow: auto; margin: .5rem 0; }
    .repolist .repo-row { display: grid; grid-template-columns: auto 1fr auto; gap: .6rem; align-items: center; padding: .5rem .8rem; border-top: 1px solid #eef2f7; }
    .repolist .repo-row:first-child { border-top: none; }
    .repolist .repo-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; color: #22364f; word-break: break-all; }
    .repo-state { font-size: .8rem; font-weight: 600; padding: .15rem .5rem; border-radius: 999px; white-space: nowrap; }
    .repo-state.unknown { background: #eef2f7; color: #64748b; }
    .repo-state.present { background: #e3f5e9; color: #1a7a3d; }
    .repo-state.absent  { background: #f4eef7; color: #7a4fa0; }
    .repo-state.updated { background: #d6f0df; color: #10662f; }
    .repo-state.created { background: #d9ebff; color: #14508f; }
    .repo-state.skipped { background: #eef2f7; color: #64748b; }
    .repo-state.failed  { background: #fde2e2; color: #a11; }
    .repo-state.working { background: #fff3cd; color: #866400; }
    .repo-state.would-update { background: #e1ecff; color: #1c4f95; }
    .repo-state.would-create { background: #ede3f7; color: #6b3fa0; }
    .repo-state.would-skip   { background: #eef2f7; color: #64748b; }

    .selbar { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .3rem; }
    .selbar a { color: #2f6fd0; cursor: pointer; font-weight: 600; font-size: .85rem; }

    .progress { height: 8px; background: #e6edf5; border-radius: 999px; overflow: hidden; margin: 1rem 0 .4rem; }
    .progress > span { display: block; height: 100%; width: 0; background: #2f6fd0; transition: width .2s ease; }
    .summary { font-size: .9rem; color: #22364f; margin: .3rem 0 0; }
    .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; background: #0f1b2d; color: #d7e3f4; border-radius: 10px; padding: .8rem 1rem; margin-top: 1rem; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

    details.help { margin-top: 1.2rem; }
    details.help summary { cursor: pointer; font-weight: 600; color: #1f3552; }
    details.help li { margin: .3rem 0; }
    .back-link { display: inline-block; margin-bottom: .3rem; color: #2f6fd0; font-weight: 600; }

  <header class="topbar">

          <span id="nav-github-text">Github</span>

        <span class="nav-divider" aria-hidden="true"></span>
        <span class="lang-group" id="lang-group" role="group" aria-label="Language selection">
          <button type="button" data-language="en" aria-pressed="true">EN</button>
          <button type="button" data-language="ko" aria-pressed="false">한국어</button>

      </nav>
    </div>
  </header>
  <main class="shell">
    <article class="window">
      <div class="titlebar">
        <span class="window-controls" aria-hidden="true">
          <span class="window-control close"></span>
          <span class="window-control minimize"></span>
          <span class="window-control maximize"></span>
        </span>
        <span id="window-title">Bulk Secret Updater</span>
      </div>
      <div class="content">
        <h1 id="page-heading">Bulk Secret Updater</h1>
        <p id="page-lead" class="lead"></p>

        <div class="callout danger" id="security-note"></div>

        <div class="field">
          <label id="token-label" for="token"></label>
          <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_… / github_pat_…">
          <div class="hint" id="token-hint"></div>
        </div>

        <div class="row">
          <div class="field">
            <label id="secret-name-label" for="secret-name"></label>
            <input id="secret-name" type="text" value="GMAIL_APP_PASSWORD" spellcheck="false">
          </div>
          <div class="field">
            <label id="owner-label" for="owner"></label>
            <input id="owner" type="text" value="leemgs" spellcheck="false">
            <div class="hint" id="owner-hint"></div>
          </div>
        </div>

        <div class="field">
          <label id="value-label" for="value"></label>
          <input id="value" type="password" autocomplete="off" spellcheck="false">
          <div class="hint" id="value-hint"></div>
        </div>
        <div class="field">
          <label id="value2-label" for="value2"></label>
          <input id="value2" type="password" autocomplete="off" spellcheck="false">
        </div>
        <label class="toggle"><input id="show-value" type="checkbox"><span id="show-value-label"></span></label>

        <label class="toggle"><input id="create-missing" type="checkbox"><span id="create-missing-label"></span></label>

        <div class="actions">
          <button class="btn secondary" id="load-btn" type="button"></button>
          <button class="btn secondary" id="check-btn" type="button" disabled></button>
          <button class="btn secondary" id="preview-btn" type="button" disabled></button>
          <button class="btn primary" id="apply-btn" type="button" disabled></button>
        </div>

        <div class="selbar" id="selbar" hidden>
          <strong id="repos-title"></strong>
          <a id="select-all"></a>
          <a id="select-none"></a>
          <a id="select-present"></a>
        </div>
        <div class="repolist" id="repolist" hidden></div>

        <div class="progress" id="progress" hidden><span></span></div>
        <p class="summary" id="summary"></p>
        <div class="log" id="log" aria-live="polite"></div>

        <details class="help">
          <summary id="help-summary"></summary>
          <div id="help-body"></div>
        </details>
      </div>
    </article>
    <footer class="page-footer">
      <a href="https://github.com/leemgs/github-projects">Github</a>
    </footer>
  </main>

          + '<li><strong>완전한 클라이언트 방식.</strong> <code>projects.json</code>에서 저장소 목록을 읽고 브라우저에서 GitHub REST API를 호출합니다. 시크릿 값은 업로드 전 각 저장소의 공개키로 libsodium sealed box 암호화됩니다(API 요구 방식과 동일).</li>'
          + '<li><strong>기본은 기존 항목만.</strong> <code>GET /repos/{owner}/{repo}/actions/secrets/{name}</code>로 확인해 200이면 있음, 404면 없음입니다. "없으면 생성"을 켜지 않으면 있는 것만 갱신합니다.</li>'
          + '<li><strong>토큰 노출.</strong> 토큰이 공개된 곳에 붙여넣어졌다면 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">github.com/settings/tokens</a> 에서 폐기하세요.</li>'
          + '<li><strong>403 / 권한 오류.</strong> 해당 저장소에 대한 시크릿 쓰기 권한이 없거나 관리자가 아닙니다.</li>'
          + '<li><strong>CLI가 편하다면?</strong> 이 저장소의 <code>tools/</code> 폴더에 Python 및 gh 기반 스크립트가 있습니다.</li>'
          + '</ul>'
      }
    };

    var lang = (function () {
      try {
        var saved = localStorage.getItem('projects-language');
        if (saved) return saved;
      } catch (e) {}
      return navigator.language.toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
    })();

    function t() { return T[lang] || T.en; }

    function applyLanguage() {
      var x = t();
      document.documentElement.lang = lang;
      document.getElementById('window-title').textContent = x.windowTitle;
      document.getElementById('brand-name').textContent = x.brand;
      document.getElementById('nav-projects-text').textContent = x.back;
      document.getElementById('nav-github-text').textContent = x.navGithub;
      var lg = document.getElementById('lang-group');
      if (lg) lg.setAttribute('aria-label', x.languageMenu || 'Language selection');
      document.getElementById('page-heading').textContent = x.heading;
      document.getElementById('page-lead').innerHTML = x.lead;
      document.getElementById('security-note').textContent = x.security;
      document.getElementById('token-label').textContent = x.tokenLabel;
      document.getElementById('token-hint').textContent = x.tokenHint;
      document.getElementById('secret-name-label').textContent = x.secretNameLabel;
      document.getElementById('owner-label').textContent = x.ownerLabel;
      document.getElementById('owner-hint').textContent = x.ownerHint;
      document.getElementById('value-label').textContent = x.valueLabel;
      document.getElementById('value-hint').textContent = x.valueHint;
      document.getElementById('value2-label').textContent = x.value2Label;
      document.getElementById('show-value-label').textContent = x.showValue;
      document.getElementById('create-missing-label').textContent = x.createMissing;
      els.loadBtn.textContent = x.loadBtn;
      els.checkBtn.textContent = x.checkBtn;
      els.previewBtn.textContent = x.previewBtn;
      els.applyBtn.textContent = x.applyBtn;
      document.getElementById('repos-title').textContent = x.reposTitle;
      document.getElementById('select-all').textContent = x.selectAll;
      document.getElementById('select-none').textContent = x.selectNone;
      document.getElementById('select-present').textContent = x.selectPresent;
      document.getElementById('help-summary').textContent = x.helpSummary;
      document.getElementById('help-body').innerHTML = x.helpBody;
      document.querySelectorAll('[data-language]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.language === lang));
      });
      renderRepoStates();
    }

    document.querySelectorAll('[data-language]').forEach(function (b) {
      b.addEventListener('click', function () {
        lang = b.dataset.language;
        try { localStorage.setItem('projects-language', lang); } catch (e) {}
        applyLanguage();
      });
    });

    // -------- state -------------------------------------------------------
    var repos = []; // { full, state, checkbox, stateEl }

    function log(line) {
      els.log.textContent += (els.log.textContent ? '\n' : '') + line;
      els.log.scrollTop = els.log.scrollHeight;
    }

    function setProgress(done, total) {
      if (!total) { els.progress.hidden = true; return; }
      els.progress.hidden = false;
      els.progressBar.style.width = Math.round((done / total) * 100) + '%';
    }

    function stateLabel(state) {
      var x = t();
      return ({
        unknown: x.stateUnknown, present: x.statePresent, absent: x.stateAbsent,
        updated: x.stateUpdated, created: x.stateCreated, skipped: x.stateSkipped,
        failed: x.stateFailed, working: x.stateWorking,
        'would-update': x.stateWouldUpdate, 'would-create': x.stateWouldCreate,
        'would-skip': x.stateWouldSkip
      })[state] || state;
    }

    function renderRepoStates() {
      repos.forEach(function (r) {
        if (r.stateEl) {
          r.stateEl.className = 'repo-state ' + r.state;
          r.stateEl.textContent = stateLabel(r.state);
        }
      });
    }

    // -------- GitHub API --------------------------------------------------
    function ghHeaders() {
      return {
        'Authorization': 'Bearer ' + els.token.value.trim(),
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };
    }

    async function ghFetch(path, options) {
      options = options || {};
      var res = await fetch(API + path, {
        method: options.method || 'GET',
        headers: ghHeaders(),
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      return res;
    }

    async function loadRepos() {
      var res = await fetch('./projects.json');
      if (!res.ok) throw new Error('projects.json ' + res.status);
      var data = await res.json();
      var owner = els.owner.value.trim() || 'leemgs';
      var names = [];
      data.forEach(function (entry) {
        var url = (entry.html_url || '').replace(/\/$/, '');
        var parts = url.split('/');
        if (parts.length >= 2) {
          names.push(parts[parts.length - 2] + '/' + parts[parts.length - 1]);
        } else if (entry.name) {
          names.push(owner + '/' + entry.name);
        }
      });
      // de-dup, preserve order
      var seen = {}, unique = [];
      names.forEach(function (n) { if (!seen[n]) { seen[n] = 1; unique.push(n); } });
      return unique;
    }

    function renderRepoList() {
      els.repolist.replaceChildren();
      repos.forEach(function (r) {
        var row = document.createElement('div');
        row.className = 'repo-row';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = true;
        r.checkbox = cb;
        var name = document.createElement('span');
        name.className = 'repo-name';
        name.textContent = r.full;
        var state = document.createElement('span');
        state.className = 'repo-state ' + r.state;
        state.textContent = stateLabel(r.state);
        r.stateEl = state;
        row.append(cb, name, state);
        els.repolist.append(row);
      });
      els.repolist.hidden = false;
      els.selbar.hidden = false;
    }

    // -------- crypto ------------------------------------------------------
    async function encryptForRepo(publicKeyB64, value) {
      await sodium.ready;
      var keyBytes = sodium.from_base64(publicKeyB64, sodium.base64_variants.ORIGINAL);
      var msgBytes = sodium.from_string(value);
      var sealed = sodium.crypto_box_seal(msgBytes, keyBytes);
      return sodium.to_base64(sealed, sodium.base64_variants.ORIGINAL);
    }

    // -------- workflows ---------------------------------------------------
    function validateBasics(requireValue) {
      var x = t();
      if (!els.token.value.trim()) { alert(x.needToken); return false; }
      if (requireValue) {
        if (!els.value.value) { alert(x.needValue); return false; }
        if (els.value.value !== els.value2.value) { alert(x.valueMismatch); return false; }
      }
      return true;
    }

    function busy(on) {
      [els.loadBtn, els.checkBtn, els.previewBtn, els.applyBtn].forEach(function (b) { b.disabled = on; });
    }

    els.loadBtn.addEventListener('click', async function () {
      if (!validateBasics(false)) return;
      var x = t();
      busy(true);
      els.summary.textContent = x.loading;
      try {
        var names = await loadRepos();
        repos = names.map(function (n) { return { full: n, state: 'unknown', checkbox: null, stateEl: null }; });
        renderRepoList();
        els.summary.textContent = x.loadedN(repos.length);
        els.checkBtn.disabled = false;
        els.previewBtn.disabled = false;
        els.applyBtn.disabled = false;
      } catch (e) {
        els.summary.textContent = '';
        log('ERROR: ' + e.message);
      } finally {
        busy(false);
        els.loadBtn.disabled = false;
      }
    });

    async function secretState(full, secretName) {
      var res = await ghFetch('/repos/' + full + '/actions/secrets/' + encodeURIComponent(secretName));
      if (res.status === 200) return 'present';
      if (res.status === 404) return 'absent';
      var body = '';
      try { body = (await res.json()).message || ''; } catch (e) {}
      throw new Error('HTTP ' + res.status + (body ? ' — ' + body : ''));
    }

    els.checkBtn.addEventListener('click', async function () {
      if (!validateBasics(false)) return;
      var x = t();
      var secretName = els.secretName.value.trim() || 'GMAIL_APP_PASSWORD';
      busy(true);
      els.log.textContent = '';
      els.summary.textContent = x.checking;
      var present = 0, absent = 0, done = 0;
      for (var i = 0; i < repos.length; i++) {
        var r = repos[i];
        r.state = 'working'; renderRepoStates();
        try {
          var st = await secretState(r.full, secretName);
          r.state = st;
          if (st === 'present') { present++; } else { absent++; }
          log((st === 'present' ? '✓ ' : '· ') + r.full + ' → ' + stateLabel(st));
        } catch (e) {
          r.state = 'failed';
          log('✗ ' + r.full + ' → ' + e.message);
        }
        renderRepoStates();
        setProgress(++done, repos.length);
      }
      els.summary.textContent = x.checkSummary(present, absent);
      busy(false);
    });

    els.previewBtn.addEventListener('click', async function () {
      // Dry-run: mirrors the CLI --dry-run. Only reads secret presence; writes nothing.
      if (!validateBasics(false)) return;
      var x = t();
      var selected = repos.filter(function (r) { return r.checkbox && r.checkbox.checked; });
      if (!selected.length) { alert(x.noSelection); return; }
      var secretName = els.secretName.value.trim() || 'GMAIL_APP_PASSWORD';
      var createMissing = els.createMissing.checked;
      busy(true);
      els.log.textContent = '';
      els.summary.textContent = x.previewing;
      log('DRY-RUN — no changes will be made.');
      var wUpdate = 0, wCreate = 0, wSkip = 0, failed = 0, done = 0;
      for (var i = 0; i < selected.length; i++) {
        var r = selected[i];
        r.state = 'working'; renderRepoStates();
        try {
          var st = await secretState(r.full, secretName);
          if (st === 'present') {
            r.state = 'would-update'; wUpdate++;
            log('~ ' + r.full + ' → ' + stateLabel('would-update'));
          } else if (createMissing) {
            r.state = 'would-create'; wCreate++;
            log('~ ' + r.full + ' → ' + stateLabel('would-create'));
          } else {
            r.state = 'would-skip'; wSkip++;
            log('· ' + r.full + ' → ' + stateLabel('would-skip'));
          }
        } catch (e) {
          r.state = 'failed'; failed++;
          log('✗ ' + r.full + ' → ' + e.message);
        }
        renderRepoStates();
        setProgress(++done, selected.length);
      }
      els.summary.textContent = x.previewSummary(wUpdate, wCreate, wSkip, failed);
      busy(false);
    });

    els.applyBtn.addEventListener('click', async function () {
      if (!validateBasics(true)) return;
      var x = t();
      var selected = repos.filter(function (r) { return r.checkbox && r.checkbox.checked; });
      if (!selected.length) { alert(x.noSelection); return; }

      // Ensure the WASM crypto lib is ready before we start.
      els.summary.textContent = x.cryptoLoading;
      try { await sodium.ready; } catch (e) { log('ERROR: ' + e.message); return; }

      var secretName = els.secretName.value.trim() || 'GMAIL_APP_PASSWORD';
      var value = els.value.value;
      var createMissing = els.createMissing.checked;
      busy(true);
      els.log.textContent = '';
      els.summary.textContent = x.applying;
      var updated = 0, created = 0, skipped = 0, failed = 0, done = 0;

      for (var i = 0; i < selected.length; i++) {
        var r = selected[i];
        r.state = 'working'; renderRepoStates();
        try {
          var st = await secretState(r.full, secretName);
          if (st === 'absent' && !createMissing) {
            r.state = 'skipped'; skipped++;
            log('· ' + r.full + ' → ' + stateLabel('skipped'));
          } else {
            var keyRes = await ghFetch('/repos/' + r.full + '/actions/secrets/public-key');
            if (!keyRes.ok) throw new Error('public-key HTTP ' + keyRes.status);
            var keyJson = await keyRes.json();
            var encrypted = await encryptForRepo(keyJson.key, value);
            var putRes = await ghFetch('/repos/' + r.full + '/actions/secrets/' + encodeURIComponent(secretName), {
              method: 'PUT',
              body: { encrypted_value: encrypted, key_id: keyJson.key_id }
            });
            if (putRes.status === 201) {
              r.state = 'created'; created++;
              log('+ ' + r.full + ' → ' + stateLabel('created'));
            } else if (putRes.status === 204) {
              r.state = 'updated'; updated++;
              log('* ' + r.full + ' → ' + stateLabel('updated'));
            } else {
              var msg = '';
              try { msg = (await putRes.json()).message || ''; } catch (e) {}
              throw new Error('PUT HTTP ' + putRes.status + (msg ? ' — ' + msg : ''));
            }
          }
        } catch (e) {
          r.state = 'failed'; failed++;
          log('✗ ' + r.full + ' → ' + e.message);
        }
        renderRepoStates();
        setProgress(++done, selected.length);
      }
      els.summary.textContent = x.doneSummary(updated, created, skipped, failed);
      busy(false);
    });

    // selection helpers
    document.getElementById('select-all').addEventListener('click', function () {
      repos.forEach(function (r) { if (r.checkbox) r.checkbox.checked = true; });
    });
    document.getElementById('select-none').addEventListener('click', function () {
      repos.forEach(function (r) { if (r.checkbox) r.checkbox.checked = false; });
    });
    document.getElementById('select-present').addEventListener('click', function () {
      repos.forEach(function (r) { if (r.checkbox) r.checkbox.checked = (r.state === 'present'); });
    });

    els.showValue.addEventListener('change', function () {
      var type = els.showValue.checked ? 'text' : 'password';
      els.value.type = type;
      els.value2.type = type;
    });

    applyLanguage();
  })();
  </script>
</body>
</html>
