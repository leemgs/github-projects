<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Websites and web apps published from Geunsik Lim's GitHub repositories.">
  <title>Geunsik Lim — Github Projects</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/site-shell.css">
  <style>
    .titlebar {
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .titlebar::before { content: none; }
    .window-controls {
      display: inline-flex;
      flex: 0 0 auto;
      gap: .45rem;
    }
    .window-control {
      width: .75rem;
      height: .75rem;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 50%;
    }
    .window-control.close { background: #ff5f57; }
    .window-control.minimize { background: #febc2e; }
    .window-control.maximize { background: #28c840; }
    .project-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .45rem .8rem;
      margin: .7rem 0 0;
      color: #52647a;
      font-size: .9rem;
    }
    .project-language {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
    }
    .language-marker {
      width: .65rem;
      height: .65rem;
      border-radius: 2px;
      background: #60758f;
    }
    .page-footer {
      padding: 1.25rem 0 .5rem;
      text-align: center;
    }
    .page-footer a {
      color: #fff;
      font-weight: 600;
    }
    /* ---- Top navigation bar ---- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 33, 62, .72);
      backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 6px 24px rgba(6, 16, 33, .18);
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: .6rem 1rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .brand img {
      width: 26px;
      height: 26px;
      filter: invert(1);
      flex: 0 0 auto;
    }
    .brand-name { font-size: 1.02rem; }
    .topnav {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .topnav-link {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .45rem .8rem;
      border-radius: 999px;
      text-decoration: none;
      color: #eaf1fb;
      font-weight: 600;
      font-size: .92rem;
      border: 1px solid transparent;
      transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }
    .topnav-link svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .topnav-link:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .18);
    }
    .topnav-link.accent {
      background: linear-gradient(135deg, #4f8cff, #2f6fd0);
      color: #fff;
      box-shadow: 0 4px 14px rgba(30, 82, 168, .45);
    }
    .topnav-link.accent:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #5c96ff, #3a7ade);
      border-color: transparent;
    }
    .nav-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, .22);
      margin: 0 .2rem;
    }
    .lang-group {
      display: inline-flex;
      gap: .3rem;
      padding: .2rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }
    .lang-group button {
      padding: .32rem .7rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #dce6f5;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: .88rem;
      transition: background .15s ease, color .15s ease;
    }
    .lang-group button[aria-pressed="true"] {
      background: #fff;
      color: #173a67;
    }
    @media (max-width: 620px) {
      .topbar-inner { flex-wrap: wrap; gap: .5rem; }
      .brand-name { font-size: .95rem; }
      .topnav { width: 100%; }
      .nav-divider { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="Github Projects home">
        <img src="/github-mark.svg" alt="">
        <span class="brand-name" id="brand-name">Github Projects</span>
      </a>
      <nav class="topnav" id="primary-nav" aria-label="Primary">
        <a class="topnav-link" id="nav-github" href="https://github.com/leemgs/github-projects" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          <span id="nav-github-text">Github</span>
        </a>
        <a class="topnav-link accent" id="nav-secrets" href="./secrets.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          <span id="nav-secrets-text">Bulk secret updater</span>
        </a>
        <span class="nav-divider" aria-hidden="true"></span>
        <span class="lang-group" id="lang-group" role="group" aria-label="Language selection">
          <button type="button" data-language="en" aria-pressed="true">EN</button>
          <button type="button" data-language="ko" aria-pressed="false">한국어</button>
        </span>
      </nav>
    </div>
  </header>
  <main class="shell">
    <article class="window">
      <div class="titlebar">
        <span class="window-controls" aria-hidden="true">
          <span class="window-control close"></span>
          <span class="window-control minimize"></span>
          <span class="window-control maximize"></span>
        </span>
        <span id="window-title">Github Projects</span>
      </div>
      <div class="content">
        <h1 id="page-heading">Published Projects</h1>
        <p id="page-lead" class="lead">Websites and web apps published with GitHub Pages from repositories owned by <a href="https://github.com/leemgs/">github.com/leemgs</a>. Projects are displayed in alphabetical order.</p>
        <label id="search-label" class="search-label" for="project-search">Search projects</label>
        <input id="project-search" class="project-search" type="search" placeholder="Search by project name or language…" autocomplete="off">
        <div id="status" class="status" role="status">Loading published projects…</div>
        <div id="projects" class="project-grid" aria-live="polite"></div>
        <noscript><p class="status">JavaScript is required to retrieve the current project list. You can browse all repositories at <a href="https://github.com/leemgs?tab=repositories">GitHub</a>.</p></noscript>
      </div>
    </article>
    <footer class="page-footer">
      <a href="https://github.com/leemgs/github-projects">github.com/leemgs/github-projects</a>
    </footer>
  </main>
  <script>
    const projects = document.querySelector('#projects');
    const status = document.querySelector('#status');
    const search = document.querySelector('#project-search');
    const languageButtons = document.querySelectorAll('[data-language]');
    const endpoint = 'https://api.github.com/users/leemgs/repos?per_page=100&type=owner&sort=updated';
    const translations = {
      en: {
        languageMenu: 'Language selection',
        windowTitle: 'Github Projects',
        brand: 'Github Projects',
        navGithub: 'Github',
        heading: 'Published Projects',
        lead: 'Websites and web apps published with GitHub Pages from repositories owned by <a href="https://github.com/leemgs/">github.com/leemgs</a>. Projects are displayed in alphabetical order.',
        searchLabel: 'Search projects',
        searchPlaceholder: 'Search by project name or language…',
        loading: 'Loading published projects…',
        updated: 'Updated',
        unspecified: 'Not specified',
        count: count => `${count} published project${count === 1 ? '' : 's'}`,
        noProjects: 'No separately published project was found.',
        matches: count => `${count} matching project${count === 1 ? '' : 's'}`,
        loadError: 'The project list could not be loaded. <a href="https://github.com/leemgs?tab=repositories">Browse the repositories on GitHub</a>.',
        footerSecrets: 'Bulk secret updater'
      },
      ko: {
        languageMenu: '언어 선택',
        windowTitle: 'Github 프로젝트',
        brand: 'Github 프로젝트',
        navGithub: 'Github',
        heading: '공개 프로젝트',
        lead: '<a href="https://github.com/leemgs/">github.com/leemgs</a> 소유 저장소에서 GitHub Pages로 공개한 웹사이트와 웹 앱입니다. 프로젝트는 알파벳순으로 표시됩니다.',
        searchLabel: '프로젝트 검색',
        searchPlaceholder: '프로젝트 이름 또는 개발 언어로 검색…',
        loading: '공개 프로젝트를 불러오는 중…',
        updated: '최종 수정',
        unspecified: '미지정',
        count: count => `공개 프로젝트 ${count}개`,
        noProjects: '별도로 공개된 프로젝트가 없습니다.',
        matches: count => `검색 결과 ${count}개`,
        loadError: '프로젝트 목록을 불러올 수 없습니다. <a href="https://github.com/leemgs?tab=repositories">GitHub에서 저장소 보기</a>.',
        footerSecrets: '일괄 시크릿 변경기'
      }
    };
    let currentLanguage = localStorage.getItem('projects-language')
      || (navigator.language.toLowerCase().startsWith('ko') ? 'ko' : 'en');
    let loadedRepositories = null;

    applyLanguage(currentLanguage);

    loadRepositories()
      .then(repositories => {
        loadedRepositories = repositories
          .filter(repo => repo.has_pages && repo.name !== 'leemgs.github.io')
          .sort((left, right) => left.name.localeCompare(right.name, 'en', {sensitivity:'base'}));
        renderProjects();
      })
      .catch(error => {
        status.innerHTML = translations[currentLanguage].loadError;
        console.error(error);
      });

    function renderProjects() {
      const text = translations[currentLanguage];
      projects.replaceChildren();
      status.textContent = loadedRepositories.length
        ? text.count(loadedRepositories.length)
        : text.noProjects;
      loadedRepositories.forEach(repo => {
        const url = repo.homepage && /^https?:\/\//.test(repo.homepage)
          ? repo.homepage
          : `https://leemgs.github.io/${encodeURIComponent(repo.name)}/`;
        const card = document.createElement('article');
        card.className = 'project';
        const language = repo.language || text.unspecified;
        const lastUpdated = new Date(repo.pushed_at || repo.updated_at);
        const formattedDate = new Intl.DateTimeFormat(currentLanguage === 'ko' ? 'ko-KR' : 'en', {
          year: 'numeric', month: 'short', day: 'numeric'
        }).format(lastUpdated);
        card.dataset.search = `${repo.name} ${language}`.toLocaleLowerCase();
        const heading = document.createElement('div');
        heading.className = 'project-heading';
        const siteLink = document.createElement('a');
        siteLink.className = 'project-name';
        siteLink.href = url;
        siteLink.target = '_blank';
        siteLink.rel = 'noopener';
        const name = document.createElement('strong');
        name.textContent = repo.name;
        siteLink.append(name);
        const repoLink = document.createElement('a');
        repoLink.className = 'repo-icon-link';
        repoLink.href = repo.html_url;
        repoLink.target = '_blank';
        repoLink.rel = 'noopener';
        repoLink.title = `${repo.name} GitHub repository`;
        repoLink.setAttribute('aria-label', `${repo.name} GitHub repository`);
        const repoIcon = document.createElement('img');
        repoIcon.src = '/github-mark.svg';
        repoIcon.alt = '';
        repoIcon.width = 24;
        repoIcon.height = 24;
        repoLink.append(repoIcon);
        heading.append(siteLink, repoLink);
        const metadata = document.createElement('p');
        metadata.className = 'project-meta';
        const updated = document.createElement('span');
        updated.append(text.updated + ' ');
        const updatedTime = document.createElement('time');
        updatedTime.dateTime = lastUpdated.toISOString();
        updatedTime.textContent = formattedDate;
        updated.append(updatedTime);
        const languageLabel = document.createElement('span');
        languageLabel.className = 'project-language';
        const languageMarker = document.createElement('span');
        languageMarker.className = 'language-marker';
        languageMarker.setAttribute('aria-hidden', 'true');
        languageLabel.append(languageMarker, language);
        metadata.append(updated, languageLabel);
        card.append(heading, metadata);
        projects.append(card);
      });
      filterProjects();
    }

    function applyLanguage(language) {
      currentLanguage = translations[language] ? language : 'en';
      const text = translations[currentLanguage];
      document.documentElement.lang = currentLanguage;
      const langGroup = document.querySelector('#lang-group');
      if (langGroup) langGroup.setAttribute('aria-label', text.languageMenu);
      document.querySelector('#window-title').textContent = text.windowTitle;
      document.querySelector('#brand-name').textContent = text.brand;
      document.querySelector('#nav-github-text').textContent = text.navGithub;
      document.querySelector('#nav-secrets-text').textContent = text.footerSecrets;
      document.querySelector('#page-heading').textContent = text.heading;
      document.querySelector('#page-lead').innerHTML = text.lead;
      document.querySelector('#search-label').textContent = text.searchLabel;
      search.placeholder = text.searchPlaceholder;
      languageButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.language === currentLanguage));
      });
      if (loadedRepositories) renderProjects();
      else status.textContent = text.loading;
    }

    languageButtons.forEach(button => {
      button.addEventListener('click', () => {
        localStorage.setItem('projects-language', button.dataset.language);
        applyLanguage(button.dataset.language);
      });
    });

    async function loadRepositories() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);

      try {
        const response = await fetch(endpoint, {
          headers: {Accept: 'application/vnd.github+json'},
          signal: controller.signal
        });
        if (!response.ok) throw new Error('GitHub returned ' + response.status);
        const repositories = await response.json();
        if (!Array.isArray(repositories)) throw new Error('GitHub returned an invalid response');
        return repositories;
      } catch (error) {
        console.warn('Using the bundled project list because GitHub is unavailable.', error);
        const fallback = await fetch('./projects.json');
        if (!fallback.ok) throw new Error('Bundled project list returned ' + fallback.status);
        return fallback.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    function filterProjects() {
      const query = search.value.trim().toLocaleLowerCase();
      let visible = 0;
      projects.querySelectorAll('.project').forEach(card => {
        const matches = !query || card.dataset.search.includes(query);
        card.hidden = !matches;
        if (matches) visible += 1;
      });
      if (query) status.textContent = translations[currentLanguage].matches(visible);
    }
    search.addEventListener('input', filterProjects);
  </script>
</body>
</html>
